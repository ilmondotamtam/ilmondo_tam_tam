<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam Tam Mondo 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #0066cc;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenuto {
            padding: 30px;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 48px;
        }

        p {
            margin: 10px 0;
            font-size: 24px;
        }

        .dominio {
            font-size: 32px;
            font-weight: bold;
            margin-top: 25px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            p {
                font-size: 20px;
            }

            .dominio {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="contenuto">
        <h1>Tam Tam Mondo 2026</h1>
        <p>ci stiamo trasferendo sul nostro nuovo dominio</p>
        <p class="dominio">mondotamtam.it</p>
    </div>

</body>
</html>
